<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pytest-given — story diagrams</title>
<style>* { box-sizing: border-box; }
[x-cloak] { display: none !important; }
/* App shell: the page fills the viewport and never scrolls as a whole, so the
   topbar, sidebar story switcher, and per-story replay controls stay put no
   matter how tall a diagram is -- only the diagram canvas itself scrolls. */
html, body { height: 100%; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: system-ui, 'Segoe UI', sans-serif; background: #fafaf7; color: #1a1a2e; }
.topbar { flex: none; padding: 10px 18px; border-bottom: 1px solid #e3e1da; font-size: 14px; }
.topbar .project { font-weight: 600; }
.layout { flex: 1; display: flex; min-height: 0; }
.sidebar { width: 230px; flex: none; border-right: 1px solid #e3e1da; padding: 12px; overflow-y: auto; }
.story-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.story-item:hover { background: #fff; border-color: #e3e1da; }
.story-item.active { background: #fff; border-color: #e07a2f; }
.story-title { font-weight: 600; font-size: 14px; }
.story-meta { font-size: 12px; color: #6b6b7a; }
main { flex: 1; min-width: 0; min-height: 0; padding: 14px 18px 0; display: flex; flex-direction: column; overflow: hidden; }
main > section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.canvas { flex: 1; min-height: 0; overflow: hidden; padding-bottom: 14px; position: relative; touch-action: none; }
.story-header { flex: none; display: flex; align-items: center; gap: 18px; }
.story-header h1 { font-size: 20px; margin: 4px 0; }
.replay { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b6b7a; }
.replay button { border: 1px solid #e3e1da; background: #fff; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 14px; }
.replay button:disabled { opacity: .4; cursor: default; }
.replay button:focus-visible { outline: 2px solid #e07a2f; }
.empty-note { color: #6b6b7a; font-style: italic; }
.no-stories { padding: 48px 24px; text-align: center; color: #6b6b7a; }
.no-stories p { margin: 4px 0; }
.no-stories-hint { font-size: 13px; }
.no-stories-hint code { background: #efeee8; border-radius: 4px; padding: 1px 5px; }
.hit-area { fill: none; pointer-events: all; }
.glyph { fill: none; stroke: #1a1a2e; stroke-width: 2.2; }
.doc { fill: #fff; }
.edge-hit { stroke: transparent; stroke-width: 12; fill: none; pointer-events: stroke; }
.edge { stroke: #5b5b6e; stroke-width: 1.6; fill: none; }
.edge.connective { stroke-dasharray: none; stroke: #8a8a98; }
.arrowhead { fill: #5b5b6e; }
.label { text-anchor: middle; font-size: 14px; font-weight: 600; fill: #1a1a2e; }
.sublabel { text-anchor: middle; font-size: 11px; fill: #6b6b7a; }
.verb { font-size: 12.5px; fill: #333; font-style: italic; }
.verb.conn { fill: #8a8a98; }
.num { text-anchor: middle; font-size: 11px; font-weight: 700; fill: #fff; }
.numbg { fill: #e07a2f; }
.activity { transition: opacity .25s ease; }
.activity.faded { opacity: .15; }
.activity.dimmed { opacity: .45; }
.tooltip { position: fixed; z-index: 10; max-width: 280px; background: #1a1a2e; color: #fafaf7; border-radius: 6px; padding: 8px 11px; font-size: 12.5px; pointer-events: none; }
.tooltip-title { font-weight: 600; }
.tooltip-kind { color: #e8955a; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin: 2px 0; }
.zoom-bar { flex: none; display: flex; align-items: center; gap: 6px; margin: 6px 0 0; }
.zoom-bar button { border: 1px solid #e3e1da; background: #fff; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 14px; min-width: 30px; }
.zoom-bar button:hover { background: #f4f2ec; }
.zoom-bar button:focus-visible { outline: 2px solid #e07a2f; }
.zoom-level { font-size: 13px; color: #6b6b7a; font-variant-numeric: tabular-nums; margin-left: 4px; }
.zoom-surface { position: absolute; top: 0; left: 0; will-change: transform; }
</style>
</head>
<body x-data="diagramsApp()" x-cloak>
<header class="topbar">
  <span class="project">pytest-given</span> · story diagrams
</header>

<div class="layout">
  <nav class="sidebar">
    
    
    <div class="story-item" :class="{ active: selectedStory === 'book-a-room' }"
         @click="selectedStory = 'book-a-room'">
      <div class="story-title">Book a Room</div>
      <div class="story-meta">3 activities</div>
    </div>
    
  </nav>
  <main>
    
    
    <section id="book-a-room" x-show="selectedStory === 'book-a-room'">
      <div class="story-header">
        <h1>Book a Room</h1>
        
        <div class="replay">
          <button @click="prevStep()" :disabled="step === null">‹</button>
          <span x-text="step === null ? 'all' : 'step ' + step + ' / ' + maxSteps['book-a-room']"></span>
          <button @click="nextStep()" :disabled="step === maxSteps['book-a-room']">›</button>
        </div>
        
      </div>
      
      <div class="zoom-bar">
        <button @click="zoomOut()" title="Zoom out">−</button>
        <button @click="zoomIn()" title="Zoom in">+</button>
        <button @click="fitDiagram()" title="Fit to view">Fit</button>
        <button @click="resetZoom()" title="Reset to 100%">100%</button>
        <span class="zoom-level" x-text="Math.round(zoom * 100) + '%'"></span>
      </div>
      <div class="canvas" x-ref="canvas_book-a-room" @wheel.prevent="onWheel($event)">
        <div class="zoom-surface" :style="surfaceStyle()">
      <svg width="1080" height="880"
           viewBox="0 0 1080 880">
        <defs>
          
          <marker id="arrow-book-a-room" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/>
          </marker>
        </defs>
        
        
        <g class="activity"
           :class="{ faded: faded(1), dimmed: hoverActivity !== null && hoverActivity !== 1 }"
           @mouseenter="hoverActivity = 1" @mouseleave="hoverActivity = null">
          
          
          <line class="edge-hit"
                x1="423.0" y1="405.0"
                x2="650.0" y2="220.0"/>
          <line class="edge connective"
                x1="423.0" y1="405.0"
                x2="650.0" y2="220.0"
                marker-end="url(#arrow-book-a-room)"/>
          
          



<circle cx="516.0" cy="325.0" r="11" class="numbg"/>
<text x="516.0" y="329.0" class="num">1</text>
<text x="532.0" y="329.0" class="verb conn">browses</text>


          
          
          
<g transform="translate(700.0,180.0)"
   @mouseenter='showTip($event, "listings", "")'
   @mouseleave="tooltip = null">
  
  <rect x="-40" y="-40" width="80" height="110" class="hit-area"/>
  
  <path d="M -16 -22 L 8 -22 L 16 -14 L 16 22 L -16 22 Z" class="glyph doc"/>
  <path d="M 8 -22 L 8 -14 L 16 -14" class="glyph"/>
  
  
  <text x="0" y="50" class="label"><tspan x="0" dy="0">listings</tspan></text>
  
</g>

          
        </g>
        
        <g class="activity"
           :class="{ faded: faded(2), dimmed: hoverActivity !== null && hoverActivity !== 2 }"
           @mouseenter="hoverActivity = 2" @mouseleave="hoverActivity = null">
          
          
          <line class="edge-hit"
                x1="436.0" y1="440.0"
                x2="636.0" y2="440.0"/>
          <line class="edge "
                x1="436.0" y1="440.0"
                x2="636.0" y2="440.0"
                marker-end="url(#arrow-book-a-room)"/>
          
          



<circle cx="510.0" cy="457.0" r="11" class="numbg"/>
<text x="510.0" y="461.0" class="num">2</text>
<text x="526.0" y="461.0" class="verb">books</text>


          
          
          
<g transform="translate(700.0,440.0)"
   @mouseenter='showTip($event, "Room", "room")'
   @mouseleave="tooltip = null">
  
  <rect x="-40" y="-40" width="80" height="110" class="hit-area"/>
  
  <path d="M -16 -22 L 8 -22 L 16 -14 L 16 22 L -16 22 Z" class="glyph doc"/>
  <path d="M 8 -22 L 8 -14 L 16 -14" class="glyph"/>
  
  
  <text x="0" y="50" class="label"><tspan x="0" dy="0">Room</tspan></text>
  
</g>

          
        </g>
        
        <g class="activity"
           :class="{ faded: faded(3), dimmed: hoverActivity !== null && hoverActivity !== 3 }"
           @mouseenter="hoverActivity = 3" @mouseleave="hoverActivity = null">
          
          
          <line class="edge-hit"
                x1="423.0" y1="475.0"
                x2="650.0" y2="660.0"/>
          <line class="edge connective"
                x1="423.0" y1="475.0"
                x2="650.0" y2="660.0"
                marker-end="url(#arrow-book-a-room)"/>
          
          



<circle cx="490.0" cy="580.0" r="11" class="numbg"/>
<text x="490.0" y="584.0" class="num">3</text>
<text x="506.0" y="584.0" class="verb conn">receives</text>


          
          
          
<g transform="translate(700.0,700.0)"
   @mouseenter='showTip($event, "Confirmation", "confirmation")'
   @mouseleave="tooltip = null">
  
  <rect x="-40" y="-40" width="80" height="110" class="hit-area"/>
  
  <path d="M -16 -22 L 8 -22 L 16 -14 L 16 22 L -16 22 Z" class="glyph doc"/>
  <path d="M 8 -22 L 8 -14 L 16 -14" class="glyph"/>
  
  
  <text x="0" y="50" class="label"><tspan x="0" dy="0">Confirmation</tspan></text>
  
</g>

          
        </g>
        
        
        <g class="actors">
          
          
<g transform="translate(380.0,440.0)"
   @mouseenter='showTip($event, "Guest", "guest")'
   @mouseleave="tooltip = null">
  
  <rect x="-40" y="-40" width="80" height="110" class="hit-area"/>
  
  <circle cx="0" cy="-16" r="9" class="glyph"/>
  <path d="M 0 -7 L 0 12 M -14 2 L 14 2 M 0 12 L -11 30 M 0 12 L 11 30" class="glyph"/>
  
  
  <text x="0" y="50" class="label"><tspan x="0" dy="0">Guest</tspan></text>
  
</g>

          
        </g>
      </svg>
        </div>
      </div>
      
    </section>
    
  </main>
</div>

<div class="tooltip" x-show="tooltip !== null" x-cloak
     :style="tooltip && ('left:' + (tooltip.x + 14) + 'px; top:' + (tooltip.y + 14) + 'px')">
  <template x-if="tooltip">
    <div>
      <div class="tooltip-title" x-text="tooltip.title"></div>
      <div class="tooltip-kind" x-text="tooltip.kind || 'unclassified'"></div>
      <div class="tooltip-def" x-text="tooltip.definition || 'No definition yet.'"></div>
    </div>
  </template>
</div>
<script>
const STORY_IDS = ["book-a-room"];
const MAX_STEPS = {"book-a-room": 3};
const DIAGRAM_SIZES = {"book-a-room": [1080, 880]};
const TERM_INFO = {"guest": {"kind": "actor", "definition": "A person making a room reservation."}, "book": {"kind": "verb", "definition": "Reserve a room for a given stay."}, "room": {"kind": "object", "definition": "A bookable hotel room."}, "confirmation": {"kind": "object", "definition": "A notification acknowledging a successful reservation."}, "cancellation-policy": {"kind": null, "definition": "The rules governing **how** and **when** a booking may be cancelled.<br>Applies to every `Room` rate."}, "overbooking": {"kind": null, "definition": "Accepting more reservations than there are rooms available."}};
function diagramsApp() {
  return {
    selectedStory: null, step: null, hoverActivity: null, tooltip: null,
    zoom: 1, panX: 0, panY: 0,
    maxSteps: MAX_STEPS,
    init() {
      let hash;
      try { hash = decodeURIComponent(location.hash.slice(1)); } catch { hash = ''; }
      this.selectedStory = STORY_IDS.includes(hash) ? hash : STORY_IDS[0];
      this.$watch('selectedStory', (id) => {
        history.replaceState(null, '', '#' + encodeURIComponent(id));
        this.step = null; this.hoverActivity = null;
        this.$nextTick(() => this.fitDiagram());
      });
      window.addEventListener('hashchange', () => {
        let next;
        try { next = decodeURIComponent(location.hash.slice(1)); } catch { next = ''; }
        if (STORY_IDS.includes(next)) this.selectedStory = next;
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') this.nextStep();
        if (e.key === 'ArrowLeft') this.prevStep();
      });
      this.$nextTick(() => this.fitDiagram());
    },
    nextStep() {
      const max = this.maxSteps[this.selectedStory];
      if (max > 0) this.step = this.step === null ? 1 : Math.min(this.step + 1, max);
    },
    prevStep() {
      if (this.step !== null) this.step = this.step <= 1 ? null : this.step - 1;
    },
    surfaceStyle() {
      return 'transform: translate(' + this.panX + 'px,' + this.panY +
             'px) scale(' + this.zoom + '); transform-origin: 0 0;';
    },
    _canvasEl() { return this.$refs['canvas_' + this.selectedStory]; },
    _setZoom(next, cx, cy) {
      // Zoom toward (cx, cy) in canvas-viewport coordinates: keep that point
      // fixed by adjusting the pan.
      next = Math.min(4, Math.max(0.1, next));
      const ratio = next / this.zoom;
      this.panX = cx - (cx - this.panX) * ratio;
      this.panY = cy - (cy - this.panY) * ratio;
      this.zoom = next;
    },
    _viewportCenter() {
      const el = this._canvasEl();
      return el ? [el.clientWidth / 2, el.clientHeight / 2] : [0, 0];
    },
    zoomIn() { const [cx, cy] = this._viewportCenter(); this._setZoom(this.zoom * 1.2, cx, cy); },
    zoomOut() { const [cx, cy] = this._viewportCenter(); this._setZoom(this.zoom / 1.2, cx, cy); },
    resetZoom() { this.zoom = 1; this.panX = 0; this.panY = 0; },
    fitDiagram() {
      const el = this._canvasEl();
      const size = DIAGRAM_SIZES[this.selectedStory];
      if (!el || !size) { this.resetZoom(); return; }
      const [w, h] = size;
      const scale = Math.min(el.clientWidth / w, el.clientHeight / h, 1) * 0.95;
      this.zoom = scale;
      this.panX = (el.clientWidth - w * scale) / 2;
      this.panY = (el.clientHeight - h * scale) / 2;
    },
    onWheel(event) {
      const el = this._canvasEl();
      const rect = el.getBoundingClientRect();
      const cx = event.clientX - rect.left;
      const cy = event.clientY - rect.top;
      // Trackpad pinch and ctrl/cmd + wheel arrive as wheel events with
      // ctrlKey/metaKey set -> zoom toward the cursor. A plain two-finger
      // scroll (no modifier) pans.
      if (event.ctrlKey || event.metaKey) {
        const factor = Math.exp(-event.deltaY * 0.01);
        this._setZoom(this.zoom * factor, cx, cy);
      } else {
        this.panX -= event.deltaX;
        this.panY -= event.deltaY;
      }
    },
    faded(n) { return this.step !== null && n > this.step; },
    showTip(event, title, termId) {
      const info = TERM_INFO[termId] || {};
      this.tooltip = { x: event.clientX, y: event.clientY,
                       title: title, kind: info.kind, definition: info.definition };
    },
  };
}
</script>
