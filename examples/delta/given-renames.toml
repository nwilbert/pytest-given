# Identity changes pytest-given can't detect by itself, read by `pytest-given delta`.
# The example's two renames: a test whose name and title both changed, and a term.

[[scenario]]
old = "test_delta_booking.py::test_walk_in"
new = "test_delta_booking.py::test_walk_in_booking"

[[term]]
old = "room"
new = "suite"
