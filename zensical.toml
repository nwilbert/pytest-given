[project]
site_name = "pytest-given"
site_description = "A pytest plugin that generates interactive HTML reports from Given/When/Then annotated tests."
site_url = "https://nwilbert.github.io/pytest-given/"
repo_url = "https://github.com/nwilbert/pytest-given"
edit_uri = "edit/main/docs/site/"
docs_dir = "docs/site"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Scenarios & steps" = "guide/scenarios.md" },
    { "Step text & placeholders" = "guide/step-text.md" },
    { "Parametrized scenarios" = "guide/parametrized.md" },
    { "Attachments" = "guide/attachments.md" },
    { "Domain Storytelling" = "guide/domain-storytelling.md" },
    { "Narration lint" = "configuration/narration-lint.md" },
    { "Working with AI agents" = "ai-agents.md" },
  ] },
  { "Reports" = [
    { "pytest options" = "configuration/pytest-options.md" },
    { "Source links & tracebacks" = "configuration/source-links.md" },
    { "Standalone CLI" = "cli.md" },
  ] },
  { "Examples" = "examples.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
font = false # fonts are self-hosted, see stylesheets/extra.css
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "toc.integrate",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
]

# System preference by default; the header button cycles system -> light -> dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra.version]
provider = "mike"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = 2 }
pymdownx.superfences = {}
pymdownx.highlight = { anchor_linenums = true }
pymdownx.inlinehilite = {}
# The changelog page embeds the repo-root CHANGELOG.md between its `site` markers.
pymdownx.snippets = { base_path = ["."], check_paths = true }
