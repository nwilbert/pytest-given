name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      # nox sessions inherit nox's own interpreter, so it must satisfy the
      # project's requires-python (>=3.14).
      - run: uv tool install --python 3.14 nox
      - run: nox -s lint
      - run: nox -s mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv tool install --python 3.14 nox
      - run: nox -s coverage
      - run: nox -s bdd_example

  # The suite imports from `src/`, so it cannot see a packaging regression. This
  # builds the artifacts and drives the installed wheel from outside the project,
  # catching a missing template or skill file here rather than at release time.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv tool install --python 3.14 nox
      - run: nox -s build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv tool install --python 3.14 nox
      - run: nox -s audit

  # Regenerates every report, updating the documents' citations with it, and
  # fails if a report's Markdown or a document would change. The `citations`
  # session checks against the committed reports instead, which a report
  # nobody regenerated passes, so it stays in the local gate alone.
  reports:
    runs-on: ubuntu-latest
    outputs:
      delta-summary: ${{ steps.delta.outputs.summary }}
      delta-url: ${{ steps.delta-artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The self-report delta reads the base commit's report, and the
          # rename log's `rev` checks need the history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv tool install --python 3.14 nox
      - run: nox -s reports_current
      # What merging the pull request changes about the self-report: the
      # committed report of the merge commit's first parent against the one
      # just regenerated. It never fails the job: a pull request that bumps the
      # report schema version can't be compared with its base.
      - name: Self-report delta
        id: delta
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          git show HEAD^1:examples/self-report/self-report-data.json > "$RUNNER_TEMP/before.json"
          uv run --no-dev pytest-given delta "$RUNNER_TEMP/before.json" \
            examples/self-report/self-report-data.json \
            --before-label main --after-label "#$PR_NUMBER" \
            --title "pytest-given self-report changes in #$PR_NUMBER" \
            > "$RUNNER_TEMP/delta.txt" 2>&1 || true
          {
            echo '### Self-report delta'
            echo '```'
            cat "$RUNNER_TEMP/delta.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "summary=$(grep -m1 '^delta: ' "$RUNNER_TEMP/delta.txt")" >> "$GITHUB_OUTPUT"
      - id: delta-artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: self-report-delta
          path: given-report/delta.html
          if-no-files-found: ignore

  # Posts the self-report delta's counts on the pull request, editing its own
  # earlier comment on later pushes. A job of its own, so the write token never
  # meets the pull request's code. A fork's pull request gets no write token,
  # so its delta stays on the run summary.
  delta-comment:
    needs: reports
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          SUMMARY: ${{ needs.reports.outputs.delta-summary }}
          ARTIFACT_URL: ${{ needs.reports.outputs.delta-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SUMMARY" ] && [ -n "$ARTIFACT_URL" ]; then
            body=$(printf '### Self-report delta\n\n`%s`\n\nDownload [delta.html](%s) and open it locally, or read the [run summary](%s).\n' \
              "$SUMMARY" "$ARTIFACT_URL" "$RUN_URL")
          else
            body=$(printf '### Self-report delta\n\nNo delta was built. See the [run summary](%s).\n' "$RUN_URL")
          fi
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"
