[project]
name = "pytest-given"
version = "0.1.0"
description = "A pytest plugin that generates interactive HTML reports from Given/When/Then annotated tests."
license = { text = "MIT" }
authors = [{ name = "Niko Wilbert", email = "mail@nikowilbert.de" }]
classifiers = ["Framework :: Pytest"]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0",
    "jinja2>=3.1",
]

[project.entry-points."pytest11"]
given = "pytest_given.plugin"

[project.scripts]
pytest-given = "pytest_given.report.cli:main"

[dependency-groups]
lint = ["ruff>=0.15.13"]
typecheck = ["mypy>=2.1.0"]
test = []
coverage = [{ include-group = "test" }, "coverage>=7.14.0"]
audit = ["pip-audit>=2.10.0"]
dev = [
    "nox>=2026.4.10",
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "coverage" },
    { include-group = "audit" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_given"]

[tool.uv]
exclude-newer = "7d"
exclude-newer-package = { msgpack = "2030-01-01" }

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "SIM", "UP", "W", "PYI"]

[tool.pytest]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
disallow_untyped_defs = true
