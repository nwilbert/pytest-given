[project]
name = "pytest-given"
version = "0.1.0"
description = "A pytest plugin that generates interactive HTML reports from Given/When/Then annotated tests."
readme = "README.md"
# PEP 639: an SPDX expression plus the files it refers to. Deliberately no
# "License :: OSI Approved :: ..." classifier — combining the two is an error.
# THIRD-PARTY-LICENSES is listed because the bundled Alpine.js ships in the wheel.
license = "MIT"
license-files = ["LICENSE.md", "THIRD-PARTY-LICENSES"]
authors = [{ name = "Niko Wilbert", email = "mail@nikowilbert.de" }]
keywords = [
    "pytest",
    "bdd",
    "given-when-then",
    "testing",
    "report",
    "living-documentation",
    "domain-storytelling",
    "ubiquitous-language",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/nwilbert/pytest-given"
Repository = "https://github.com/nwilbert/pytest-given"
Issues = "https://github.com/nwilbert/pytest-given/issues"
Changelog = "https://github.com/nwilbert/pytest-given/blob/main/CHANGELOG.md"

[project.entry-points."pytest11"]
given = "pytest_given.plugin"

[project.scripts]
pytest-given = "pytest_given.cli:main"

[dependency-groups]
lint = ["ruff>=0.15.13"]
typecheck = ["mypy>=2.1.0"]
test = []
coverage = [{ include-group = "test" }, "coverage>=7.14.0"]
audit = ["pip-audit>=2.10.0"]
dev = [
    "nox>=2026.4.10",
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "coverage" },
    { include-group = "audit" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_given"]

# An sdist should build the wheel and run the test suite — nothing more.
# Hatchling's default is "every file not gitignored", which also sweeps in
# untracked local directories, so this is an allowlist rather than a list of
# exclusions. `pyproject.toml`, the readme, and the license files are always
# included. GLOSSARY.md is load-bearing: tests/conftest.py loads it as a
# FileGlossary. `examples/` is deliberately out — 2.6 MB of pre-rendered
# reports that no test reads (the eight `examples/` mentions under tests/ are
# all string literals), browsable on GitHub instead.
[tool.hatch.build.targets.sdist]
# Patterns are gitignore-style: a leading slash anchors to the project root.
# Without it, "GLOSSARY.md" also matches examples/file-glossary-booking/GLOSSARY.md.
include = [
    "/src",
    "/tests",
    "/conftest.py",
    "/noxfile.py",
    "/uv.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/GLOSSARY.md",
    "/AGENTS.md",
]

[tool.uv]
exclude-newer = "7d"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "SIM", "UP", "W", "PYI"]

[tool.ruff.lint.per-file-ignores]
# Scenario tests deliberately nest a vanilla `with pytest.raises(...):` inside a
# narration step (`with when(...):` capturing excinfo for a following `then`) so
# the report step and the assertion read as separate, load-bearing constructs.
"tests/**" = ["SIM117"]

[tool.pytest]
testpaths = ["tests"]
given_lint_ignore = [
    # Honestly two-phase: constructing the descriptor is the action under
    # test and there is no input to arrange (see the authoring skill's
    # honest-two-phase convention).
    "missing-phase: tests/unit/capture/test_step_descriptor.py::test_context_manager_basic",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
disallow_untyped_defs = true
