[project]
name = "pytest-given"
version = "0.2.0"
description = "A pytest plugin that generates interactive HTML reports from Given/When/Then annotated tests."
readme = "README.md"
# PEP 639: an SPDX expression plus the files it refers to. Deliberately no
# "License :: OSI Approved :: ..." classifier — combining the two is an error.
# THIRD-PARTY-LICENSES is listed because the bundled Alpine.js ships in the wheel.
license = "MIT"
license-files = ["LICENSE.md", "THIRD-PARTY-LICENSES"]
authors = [{ name = "Niko Wilbert", email = "mail@nikowilbert.de" }]
keywords = [
    "pytest",
    "bdd",
    "given-when-then",
    "testing",
    "report",
    "living-documentation",
    "domain-storytelling",
    "ubiquitous-language",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/nwilbert/pytest-given"
Repository = "https://github.com/nwilbert/pytest-given"
Issues = "https://github.com/nwilbert/pytest-given/issues"
Changelog = "https://github.com/nwilbert/pytest-given/blob/main/CHANGELOG.md"

[project.entry-points."pytest11"]
given = "pytest_given.plugin"

[project.scripts]
pytest-given = "pytest_given.cli:main"

[dependency-groups]
lint = ["ruff>=0.15.13"]
nox = ["nox>=2026.4.10"]
typecheck = ["mypy>=2.1.0", { include-group = "nox" }]
test = []
coverage = [{ include-group = "test" }, "coverage>=7.14.0"]
audit = ["pip-audit>=2.10.0"]
dev = [
    { include-group = "nox" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "coverage" },
    { include-group = "audit" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_given"]

# An sdist should build the wheel and run the test suite — nothing more.
# Hatchling's default is "every file not gitignored", which also sweeps in
# untracked local directories, so this is an allowlist rather than a list of
# exclusions. `pyproject.toml`, the readme, and the license files are always
# included. GLOSSARY.md is load-bearing: tests/conftest.py loads it as a
# FileGlossary. `examples/` is deliberately out — 2.6 MB of pre-rendered
# reports that no test reads (the eight `examples/` mentions under tests/ are
# all string literals), browsable on GitHub instead.
[tool.hatch.build.targets.sdist]
# Patterns are gitignore-style: a leading slash anchors to the project root.
# Without it, "GLOSSARY.md" also matches examples/file-glossary-booking/GLOSSARY.md.
include = [
    "/src",
    "/tests",
    "/conftest.py",
    "/noxfile.py",
    "/uv.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/GLOSSARY.md",
    "/AGENTS.md",
]

[tool.uv]
exclude-newer = "7d"

[tool.ruff]
# Generated by gen_large_scenarios.py and gitignored; the generator is linted.
extend-exclude = ["benchmarks/test_large_scenarios.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# `explicit-preview-rules` keeps preview mode from pulling in every preview rule
# of a selected family: a preview rule is active only when named by its exact
# code below. PLW1514 is the only one that qualifies today.
preview = true
explicit-preview-rules = true
select = [
    "B",       # flake8-bugbear — likely bugs and design problems
    "C4",      # flake8-comprehensions — needless list/dict/set round-trips
    "E",       # pycodestyle errors
    "F",       # Pyflakes — undefined names, unused imports
    "I",       # isort — import ordering
    "PT",      # flake8-pytest-style — fixture and parametrize idioms
    "RUF",     # Ruff-specific rules
    "SIM",     # flake8-simplify
    "UP",      # pyupgrade — syntax modernization for the target version
    "W",       # pycodestyle warnings
    "PYI",     # flake8-pyi — stub and typing-construct conventions
    "N",       # pep8-naming — PEP 8 naming for classes, functions, args, modules
    "PTH",     # flake8-use-pathlib — os.path / open where pathlib fits
    "PLE",     # Pylint "error" category — genuine bugs, no style opinions
    "RET",     # flake8-return — needless else-after-return, redundant `return None`
    "PGH",     # pygrep-hooks — bans bare `# noqa` / `# type: ignore`
    "DTZ",     # flake8-datetimez — datetime constructors without an explicit tzinfo
    "ISC",     # flake8-implicit-str-concat — adjacent literals, usually a missing comma
    "FLY",     # flynt — static `str.join` that should be an f-string
    "RSE",     # flake8-raise — needless parens when re-raising a class
    "SLOT",    # flake8-slots — str/tuple/namedtuple subclasses missing __slots__
    "EXE",     # flake8-executable — shebang without the exec bit, and the reverse
    "T10",     # flake8-debugger — a forgotten breakpoint() or `import pdb`
    "INT",     # flake8-gettext — f-strings passed to _(), which breaks extraction
    "G",       # flake8-logging-format — f-strings in log calls instead of %s + args
    "LOG",     # flake8-logging — logging misuse (.exception() outside a handler)
    "FURB",    # refurb — modernizations beyond what UP covers
    "PERF",    # Perflint — loops with a faster comprehension/extend form
    "PIE",     # flake8-pie — assorted unnecessary code
    "A",       # flake8-builtins — names shadowing a builtin
    "BLE",     # flake8-blind-except — `except Exception` that swallows everything
    "PLW1510", # subprocess.run without an explicit check= argument
    "PLW1514", # open/read_text without encoding=; the locale default is cp1252 on Windows
]

[tool.ruff.lint.per-file-ignores]
# Scenario tests deliberately nest a vanilla `with pytest.raises(...):` inside a
# narration step (`with when(...):` capturing excinfo for a following `then`) so
# the report step and the assertion read as separate, load-bearing constructs.
"tests/**" = ["SIM117"]

[tool.pytest]
testpaths = ["tests"]
given_lint_ignore = [
    # Honestly two-phase: constructing the descriptor is the action under
    # test and there is no input to arrange (see the authoring skill's
    # honest-two-phase convention).
    "missing-phase: tests/unit/capture/test_step_descriptor.py::test_context_manager_basic",
    # `collector.attach(...)` is the call under test here, not a narration
    # attachment; `empty-step` matches the method name whatever the receiver.
    "empty-step: tests/unit/capture/test_collector.py::test_attach_outside_any_step_raises",
    # Same shape one level up: `attach(...)` is the action being rejected, so
    # the step is an action, not a bare attachment.
    "empty-step: tests/unit/capture/test_step_descriptor.py::test_attach_rejects_a_non_str_label*",
    # `phase_name` picks the phase factory in the given block, and the body
    # reaches it through `open_template_step`'s closure — used, but not by a
    # name the rule can see in the step body.
    "unused-interpolation: tests/unit/capture/test_step_descriptor.py::test_phase_with_pytest_given_template_as_context_manager_raises*",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = false
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
disallow_untyped_defs = true
