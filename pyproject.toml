[project]
name = "pytest-given"
version = "0.1.0"
description = "A pytest plugin that generates interactive HTML reports from Given/When/Then annotated tests."
license = { text = "MIT" }
authors = [{ name = "Niko Wilbert", email = "mail@nikowilbert.de" }]
classifiers = ["Framework :: Pytest"]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0",
    "jinja2>=3.1",
]

[project.entry-points."pytest11"]
given = "pytest_given.plugin"

[project.scripts]
pytest-given = "pytest_given.report.cli:main"

[dependency-groups]
lint = ["ruff>=0.15.13"]
typecheck = ["mypy>=2.1.0"]
test = []
coverage = [{ include-group = "test" }, "coverage>=7.14.0"]
audit = ["pip-audit>=2.10.0"]
dev = [
    "nox>=2026.4.10",
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "coverage" },
    { include-group = "audit" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_given"]

[tool.uv]
exclude-newer = "7d"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "SIM", "TID251", "TID253", "UP", "W", "PYI"]

[tool.ruff.lint.flake8-tidy-imports]
# TID253: enforced in report/ — bans imports of capture/ and of model/ submodules.
banned-module-level-imports = [
    "pytest_given.capture",
    "pytest_given.model.schema",
    "pytest_given.model.serde",
    "pytest_given.model.errors",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# TID251: enforced in capture/ — bans imports of report/ and of model/ submodules.
"pytest_given.report" = { msg = "capture/ may not depend on report/. Both capture and report depend on model; they do not depend on each other." }
"pytest_given.model.schema" = { msg = "Cross-subpackage code must import from pytest_given.model, not its submodules." }
"pytest_given.model.serde" = { msg = "Cross-subpackage code must import from pytest_given.model, not its submodules." }
"pytest_given.model.errors" = { msg = "Cross-subpackage code must import from pytest_given.model, not its submodules." }

[tool.ruff.lint.per-file-ignores]
"src/pytest_given/__init__.py" = ["TID251", "TID253"]
"src/pytest_given/plugin.py" = ["TID251", "TID253"]
"src/pytest_given/capture/**" = ["TID253"]
"src/pytest_given/report/**" = ["TID251"]
"src/pytest_given/model/**" = ["TID251", "TID253"]
"tests/**" = ["TID251", "TID253"]

[tool.pytest]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
disallow_untyped_defs = true
